project:
  seed: 42
  device: auto

geometry:
  sheet_width_mm: 210.0
  sheet_height_mm: 297.0
  pixels_per_mm: 10.0
  marker_margin_mm: 10.0

segmentation:
  operational_method: sam2
  classical:
    enabled_as_prompt_localizer: true
    enabled_as_experimental_baseline: true
  sam2:
    model_config: configs/sam2/sam2_hiera_t.yaml
    checkpoint: resultados/modelos/sam2_hiera_tiny.pt
    box_margin_fraction: 0.05
    multimask_output: true
    min_component_area_px: 300
export:
  offset_mm: 0.0
  wcs_y_direction: down
  include_wcs_reference: true
  bounds_tolerance_mm: 50.0

evaluation:
  metrics:
    - dice
    - iou
    - boundary_f1
    - component_error
  timing_warmup_runs: 1
  timing_repetitions: 5
