project:
  seed: 42
  device: auto

geometry:
  sheet_width_mm: 600.0
  sheet_height_mm: 400.0
  pixels_per_mm: 2.0

segmentation:
  operational_method: sam2
  classical:
    enabled_as_prompt_localizer: true
    enabled_as_experimental_baseline: true
  sam2:
    model_config: sam2_hiera_t.yaml
    checkpoint: resultados/modelos/sam2_hiera_tiny.pt
    box_margin_fraction: 0.05
    multimask_output: true
    min_component_area_px: 100
  random_forest:
    model_path: resultados/modelos/random_forest_optimized.joblib
    probability_threshold: 0.55

evaluation:
  metrics:
    - dice
    - iou
    - boundary_f1
    - component_error
  timing_warmup_runs: 1
  timing_repetitions: 5

